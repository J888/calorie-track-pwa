<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16100d"><meta name="description" content="A quiet, simple daily calorie tracker.">
  <meta name="apple-mobile-web-app-capable" content="yes"><link rel="apple-touch-icon" href="/icon-192.png">
  <title>Daily — calorie tracker</title><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header>
      <div id="progress" class="progress-ring" role="progressbar" aria-label="Daily calorie goal progress" aria-valuemin="0" aria-valuemax="2700" aria-valuenow="0">
        <svg viewBox="0 0 48 48" aria-hidden="true"><circle id="progress-fill" cx="24" cy="24" r="20" pathLength="100" stroke-dasharray="0 100" transform="rotate(-90 24 24)"/><path id="progress-check" d="M15 24l6 6 12-12" hidden/></svg>
      </div>
      <span class="quiet" id="save-status">Your daily calorie journal</span>
    </header>
    <section class="summary" aria-label="Daily calorie total and goal">
      <div class="total"><span id="total" aria-live="polite">0</span><span class="goal-divider">/</span><input id="goal" aria-label="Daily calorie goal" inputmode="decimal" value="2700" autocomplete="off"><span class="unit">kcal</span></div>
      <p class="summary-note" id="remaining" aria-live="polite">2,700 to go! 👀</p>
    </section>
    <section class="journal" aria-label="Food journal">
      <div class="day-bar"><div><h1 id="day-title">Today</h1><p id="day-subtitle"></p></div><div class="date-controls"><button id="previous" aria-label="Previous day">‹</button><input id="date" type="date" aria-label="Choose journal date"><button id="next" aria-label="Next day">›</button></div></div>
      <div class="column-labels"><span>FOOD</span><span>CALORIES</span></div>
      <form id="entry-form" autocomplete="off">
        <div class="entry-row draft" id="draft">
          <div class="food-field"><input id="food" aria-label="Food name" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="suggestions" placeholder="Enter food" maxlength="160"><div id="suggestions" role="listbox" hidden></div></div>
          <input id="calories" aria-label="Calories" inputmode="decimal" placeholder="kcal" autocomplete="off">
          <span class="draft-mark" aria-hidden="true">↵</span>
        </div>
      </form>
      <p id="entry-hint" class="hint">Enter a food and calories. Press Enter or tap away to save.</p>
      <div id="entries"></div>
      <div id="empty"><span class="empty-icon">☷</span><h2>A fresh page for your day</h2><p>Your meals will appear here as you go.</p></div>
      <div class="journal-footer"><span id="count">0 entries</span><button id="today" hidden>Back to today ↗</button></div>
    </section>
    <footer><span class="local-dot"></span> Saved on this device · Works offline <button id="export">Export data</button></footer>
    <p id="notice" role="status" hidden></p>
    <div id="undo" hidden><span>Entry removed</span><button id="undo-button">Undo</button></div>
  </main><script type="module" src="/app.js"></script>
</body></html>
